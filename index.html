<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hihihiimdoris 雲端健康日誌 (大 Boss 權限版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        .scroll-wheel-container {
            position: relative;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 0.5rem;
        }
        .scroll-wheel-select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-family: monospace;
            text-align: center;
            cursor: pointer;
            overflow-y: auto !important;
            display: block !important;
        }
        .scroll-wheel-select::-webkit-scrollbar {
            display: none;
        }
        .scroll-wheel-select option {
            padding: 8px 0;
            border-bottom: 1px solid rgba(241, 245, 249, 0.5);
        }
        .scroll-wheel-select option:checked {
            background-color: #e6f4ea !important;
            color: #059669;
            font-weight: bold;
        }
    </style>
</head>
<body id="mainBody" class="bg-slate-50 min-h-screen py-6 px-4 text-base transition-all duration-200">

    <div id="authSection" class="max-w-md mx-auto my-12 bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-6">
            <h1 id="authTitle" class="text-2xl font-bold text-slate-900">🔐 登入系統</h1>
            <p id="authSubtitle" class="text-xs text-slate-500 mt-1">帳戶與數據將即時同步至 Firebase 雲端資料庫</p>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">帳號</label>
                <input type="text" id="authName" placeholder="請輸入帳號" class="w-full rounded-xl border-slate-200 border p-3 text-sm outline-none focus:border-emerald-500 bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">密碼</label>
                <input type="password" id="authPassword" placeholder="請輸入密碼" class="w-full rounded-xl border-slate-200 border p-3 text-sm outline-none focus:border-emerald-500 bg-slate-50">
            </div>
            <div id="authHeightField" style="display: none;">
                <label class="block text-xs font-bold text-slate-400 mb-1">初始身高 (cm)</label>
                <input type="number" id="authHeight" step="0.1" placeholder="請輸入身高（公分）" class="w-full rounded-xl border-slate-200 border p-3 text-sm outline-none focus:border-emerald-500 bg-slate-50">
            </div>
            <button id="authPrimaryBtn" onclick="handleAuthSubmit()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl hover:bg-emerald-700 shadow-md transition-all text-sm mt-2">安全登入系統</button>
            <div class="text-center text-xs text-slate-500 mt-4">
                <span id="authSwitchText">還沒有帳號嗎？</span>
                <button onclick="toggleAuthMode()" id="authSwitchBtn" class="text-emerald-600 font-bold underline ml-1">前往註冊</button>
            </div>
        </div>
    </div>

    <div id="adminDashboard" class="max-w-6xl mx-auto space-y-6 hidden">
        <div class="bg-slate-900 text-white rounded-2xl shadow-xl p-6 flex justify-between items-center flex-wrap gap-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">🔑 萬能雲端管理員主控台 <span class="bg-rose-500 text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full font-sans">Cloud Admin</span></h1>
                <p class="text-xs text-slate-400 mt-1">目前正實時連接雲端，檢視所有跨裝置的使用者名冊</p>
            </div>
            <button onclick="handleLogout()" class="bg-white/10 hover:bg-white/20 text-white text-sm font-medium px-4 py-2 rounded-xl transition-all">登出管理員</button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><span class="w-1.5 h-6 bg-indigo-500 rounded-full"></span> 全球雲端註冊用戶名單</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 text-slate-500">
                        <tr>
                            <th class="p-3 font-bold">使用者帳號</th>
                            <th class="p-3 font-bold">登入密碼</th>
                            <th class="p-3 font-bold">設定身高 (cm)</th>
                            <th class="p-3 font-bold text-center">後台操作</th>
                        </tr>
                    </thead>
                    <tbody id="adminUserTableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>


    <div id="mainDashboard" class="max-w-6xl mx-auto space-y-6 hidden">
        
        <div class="bg-white rounded-2xl shadow-sm p-6 flex flex-wrap justify-between items-center gap-4 border border-slate-100">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 mb-1 flex flex-wrap items-center gap-2">
                    🩺 <span id="userNameDisplay"></span> 的健康儀表板 
                    <span class="text-sm font-normal text-slate-400 flex items-center bg-slate-50 px-2 py-1 rounded-xl border border-slate-200">
                        📏 身高: 
                        <input type="number" id="dashboardHeightInput" step="0.1" onchange="updateUserHeight(this.value)" class="w-16 text-center font-bold text-emerald-600 bg-transparent outline-none focus:bg-white focus:ring-1 focus:ring-emerald-500 rounded mx-1"> cm
                    </span>
                    <span id="adminViewingBadge" class="hidden text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-1 rounded-lg">👁️ 管理員雲端視察中</span>
                </h1>
                <p class="text-xs text-slate-500">☁️ 雲端數據即時同步中</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <button id="adminBackBtn" onclick="returnToAdminHome()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-xl transition-all">
                    ⬅️ 返回管理員名單
                </button>

                <button id="layoutToggleBtn" onclick="toggleLayoutMode()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-2 rounded-xl transition-all">
                    🖥️ 切換至手機單欄模式
                </button>
                
                <div class="bg-slate-100 p-1 rounded-xl flex gap-1 text-xs font-bold">
                    <button id="fontSize-sm" onclick="changeFontSize('text-sm')" class="px-3 py-1 rounded-lg text-slate-500">A-</button>
                    <button id="fontSize-base" onclick="changeFontSize('text-base')" class="px-3 py-1 rounded-lg bg-white text-emerald-600 shadow-sm">A</button>
                    <button id="fontSize-lg" onclick="changeFontSize('text-lg')" class="px-3 py-1 rounded-lg text-slate-500">A+</button>
                </div>

                <div class="h-4 w-px bg-slate-200 mx-1"></div>
                <button onclick="handleLogout()" class="text-slate-400 hover:text-rose-600 text-sm font-medium transition-colors">登出</button>
            </div>
        </div>
        
        <div id="gridLayout" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div id="inputFormBlock" class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100 h-fit space-y-6">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2"><span class="w-1.5 h-6 bg-emerald-500 rounded-full"></span> 錄入數據</h2>
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2">量測日期</label>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="scroll-wheel-container"><select id="scrollYear" class="scroll-wheel-select" size="4" onchange="updateDays()"></select></div>
                        <div class="scroll-wheel-container"><select id="scrollMonth" class="scroll-wheel-select" size="4" onchange="updateDays()"></select></div>
                        <div class="scroll-wheel-container"><select id="scrollDay" class="scroll-wheel-select" size="4"></select></div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2">量測時間</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="scroll-wheel-container"><select id="scrollHour" class="scroll-wheel-select" size="4"></select></div>
                        <div class="scroll-wheel-container"><select id="scrollMinute" class="scroll-wheel-select" size="4"></select></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl text-xs text-center font-bold">
                    <button id="modeFull" onclick="setMode(false)" class="bg-white text-emerald-600 py-2 rounded-lg shadow-sm">完整模式</button>
                    <button id="modeTempOnly" onclick="setMode(true)" class="text-slate-500 py-2 rounded-lg">僅記體溫</button>
                </div>

                <div id="bodyMetricsFields" class="space-y-1">
                    <label class="block text-xs font-medium text-slate-400">體重 (kg)</label>
                    <input type="number" id="weight" step="0.1" placeholder="公斤" class="w-full rounded-xl border-slate-200 border p-3 text-base font-bold outline-none bg-white">
                </div>

                <div id="bpFields" class="space-y-2">
                    <label class="block text-xs font-medium text-slate-400">血壓 (mmHg)</label>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="sys" placeholder="收縮壓(高壓)" class="w-full rounded-xl border-slate-200 border p-3 text-base font-bold outline-none bg-white">
                        <input type="number" id="dia" placeholder="舒張壓(低壓)" class="w-full rounded-xl border-slate-200 border p-3 text-base font-bold outline-none bg-white">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-medium text-slate-400">體溫 (°C)</label>
                    <input type="number" id="temp" step="0.1" placeholder="例如：36.5" class="w-full rounded-xl border-slate-200 border p-3 text-xl font-bold text-emerald-600 outline-none bg-white">
                </div>
                
                <button onclick="saveRecord()" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-xl hover:bg-emerald-700 shadow-md transition-all mt-4">儲存紀錄</button>
            </div>

            <div id="dataDisplayArea" class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2"><span class="w-1.5 h-6 bg-rose-500 rounded-full"></span> 趨勢分析圖</h2>
                        <button onclick="exportToCSV()" class="text-emerald-700 text-xs font-bold bg-emerald-50 px-3 py-2 rounded-lg hover:bg-emerald-100 transition-all">💚 匯出至 Excel (CSV)</button>
                    </div>
                    <div class="h-80 w-full"><canvas id="healthChart"></canvas></div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100">
                    <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><span class="w-1.5 h-6 bg-amber-500 rounded-full"></span> 歷史日誌</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-slate-50 text-slate-500">
                                <tr>
                                    <th class="p-3 font-bold">時間</th>
                                    <th class="p-3 font-bold">體重</th>
                                    <th class="p-3 font-bold">血壓 (收縮壓/舒張壓)</th>
                                    <th class="p-3 font-bold">體溫</th>
                                    <th class="p-3 font-bold text-center" id="thAction">操作</th>
                                </tr>
                            </thead>
                            <tbody id="logTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                        <div id="noDataText" class="text-center py-10 text-slate-400 text-xs hidden">尚無數據，請開始記錄</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 🌟 妳的 Firebase 初始化設定
        const firebaseConfig = {
            apiKey: "AIzaSyCERuzuN4FE14Tb54xE-FQUdbcVRVZ9jts",
            authDomain: "health-log-6bdc7.firebaseapp.com",
            projectId: "health-log-6bdc7",
            storageBucket: "health-log-6bdc7.firebasestorage.app",
            messagingSenderId: "13112727574",
            appId: "1:13112727574:web:f1c32e3b1f4af5d526fd37",
            measurementId: "G-NVX7N1S4YY"
        };
        
        if (!firebaseConfig.databaseURL) {
            firebaseConfig.databaseURL = `https://${firebaseConfig.projectId}-default-rtdb.firebaseio.com/`;
        }
        
        firebase.initializeApp(firebaseConfig);
        let database = firebase.database();

        // 👑 雲端管理員金鑰設定處
        const ADMIN_USERNAME = "admin";
        const ADMIN_PASSWORD = "8888";

        let currentUser = null; 
        let userHeight = ""; 
        let myLogs = []; 
        let healthChart = null; 
        let isTempOnly = false; 
        let isRegisterMode = false; // 預設為登入畫面
        let forceMobileLayout = false;
        let isAdminViewing = false; 

        // 🕒 初始化自訂滾軸選擇器數據
        const now = new Date();
        const currentYear = now.getFullYear();
        
        const yearSelect = document.getElementById('scrollYear');
        for(let i = currentYear - 2; i <= currentYear + 2; i++) { yearSelect.options.add(new Option(i + "年", i)); }
        yearSelect.value = currentYear;

        const monthSelect = document.getElementById('scrollMonth');
        for(let i = 1; i <= 12; i++) { monthSelect.options.add(new Option(i + "月", i)); }
        monthSelect.value = now.getMonth() + 1;

        function updateDays() {
            const daySelect = document.getElementById('scrollDay');
            const prevVal = daySelect.value || now.getDate();
            daySelect.innerHTML = "";
            const year = parseInt(yearSelect.value);
            const month = parseInt(monthSelect.value);
            const daysInMonth = new Date(year, month, 0).getDate();
            
            for(let i = 1; i <= daysInMonth; i++) { daySelect.options.add(new Option(i + "日", i)); }
            daySelect.value = prevVal <= daysInMonth ? prevVal : daysInMonth;
        }
        updateDays();

        const hourSelect = document.getElementById('scrollHour');
        for(let i = 0; i <= 23; i++) { hourSelect.options.add(new Option(i.toString().padStart(2, '0') + "時", i)); }
        hourSelect.value = now.getHours();

        const minSelect = document.getElementById('scrollMinute');
        for(let i = 0; i <= 59; i++) { minSelect.options.add(new Option(i.toString().padStart(2, '0') + "分", i)); }
        minSelect.value = now.getMinutes();

        function getWeekdayStr(dateStr) {
            const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            const d = new Date(dateStr.split(' ')[0]);
            return weekdays[d.getDay()] || "";
        }

        function toggleLayoutMode() {
            forceMobileLayout = !forceMobileLayout;
            const gridLayout = document.getElementById('gridLayout');
            const dataArea = document.getElementById('dataDisplayArea');
            const toggleBtn = document.getElementById('layoutToggleBtn');
            
            if (forceMobileLayout) {
                gridLayout.className = "flex flex-col gap-6";
                dataArea.className = "space-y-6 w-full";
                toggleBtn.innerText = "🖥️ 切換至電腦寬螢幕模式";
            } else {
                gridLayout.className = "grid grid-cols-1 lg:grid-cols-3 gap-6";
                dataArea.className = "lg:col-span-2 space-y-6";
                toggleBtn.innerText = "📱 切換至手機單欄模式";
            }
        }

        function changeFontSize(sizeClass) {
            const body = document.getElementById('mainBody');
            body.className = body.className.replace(/text-(sm|base|lg)/g, sizeClass);
            
            const sizes = ['text-sm', 'text-base', 'text-lg'];
            sizes.forEach(s => {
                const btn = document.getElementById(`fontSize-${s.replace('text-', '')}`);
                btn.className = (s === sizeClass) ? "px-3 py-1 rounded-lg bg-white text-emerald-600 shadow-sm" : "px-3 py-1 rounded-lg text-slate-500";
            });
        }

        function toggleAuthMode() { 
            isRegisterMode = !isRegisterMode; 
            document.getElementById('authTitle').innerText = isRegisterMode ? "📝 建立健康帳戶" : "🔐 登入系統"; 
            document.getElementById('authPrimaryBtn').innerText = isRegisterMode ? "確認註冊帳號" : "安全登入系統"; 
            document.getElementById('authSwitchBtn').innerText = isRegisterMode ? "前往登入" : "前往註冊";
            document.getElementById('authSwitchText').innerText = isRegisterMode ? "已經有帳號了？" : "還沒有帳號嗎？";
            document.getElementById('authHeightField').style.display = isRegisterMode ? "block" : "none";
        }

        function updateUserHeight(newVal) {
            if(isAdminViewing || !newVal || isNaN(newVal) || !currentUser) return;
            userHeight = parseFloat(newVal);
            database.ref('users/' + currentUser).update({
                height: userHeight
            }).catch(err => handleDatabaseUrlError(err));
        }

        function handleDatabaseUrlError(error) {
            if (error && error.message && error.message.indexOf("databaseURL") !== -1) {
                database = firebase.app().database(`https://${firebaseConfig.projectId}-default-rtdb.asia-southeast1.firebasedatabase.app/`);
                alert("正在切換至亞洲雲端高速節點，請再按一次剛才的操作喔！");
            }
        }

        // 🔑 驗證登入 / 註冊
        function
