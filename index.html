<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hihihiimdoris 雲端健康日誌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        /* 🎨 強制將下拉選單變成可直接上下滾動的滾軸滾輪 */
        .scroll-wheel-container {
            position: relative;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 0.5rem;
        }
        .scroll-wheel-select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-family: monospace;
            text-align: center;
            cursor: pointer;
            /* 關鍵：強制呈現多行並允許滾動 */
            overflow-y: auto !important;
            display: block !important;
        }
        /* 隱藏討厭的滾動條，讓畫面像 App 一樣乾淨 */
        .scroll-wheel-select::-webkit-scrollbar {
            display: none;
        }
        .scroll-wheel-select option {
            padding: 8px 0;
            border-bottom: 1px solid rgba(241, 245, 249, 0.5);
        }
        .scroll-wheel-select option:checked {
            background-color: #e6f4ea !important;
            color: #059669;
            font-weight: bold;
        }
    </style>
</head>
<body id="mainBody" class="bg-slate-50 min-h-screen py-6 px-4 text-base transition-all duration-200">

    <div id="authSection" class="max-w-md mx-auto my-12 bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-6">
            <h1 id="authTitle" class="text-2xl font-bold text-slate-900">📝 建立健康帳戶</h1>
            <p id="authSubtitle" class="text-xs text-slate-500 mt-1">帳戶與數據將安全儲存於雲端資料庫</p>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">帳號</label>
                <input type="text" id="authName" placeholder="請輸入帳號" class="w-full rounded-xl border-slate-200 border p-3 text-sm outline-none focus:border-emerald-500 bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">密碼</label>
                <input type="password" id="authPassword" placeholder="請輸入密碼" class="w-full rounded-xl border-slate-200 border p-3 text-sm outline-none focus:border-emerald-500 bg-slate-50">
            </div>
            <button id="primaryAuthBtn" onclick="handleAuthSubmit()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl hover:bg-emerald-700 shadow-md transition-all text-sm mt-2">確認註冊雲端帳號</button>
            <div class="text-center text-xs text-slate-500 mt-4">
                <span id="authSwitchText">已經有帳號了？</span>
                <button onclick="toggleAuthMode()" id="authSwitchBtn" class="text-emerald-600 font-bold underline ml-1">前往登入</button>
            </div>
        </div>
    </div>

    <div id="mainDashboard" class="max-w-6xl mx-auto space-y-6 hidden">
        
        <div class="bg-white rounded-2xl shadow-sm p-6 flex flex-wrap justify-between items-center gap-4 border border-slate-100">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 mb-1">🩺 <span id="userNameDisplay"></span> 的雲端儀表板</h1>
                <p class="text-xs text-slate-500">🔒 您的數據已進行安全加密同步</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <button id="layoutToggleBtn" onclick="toggleLayoutMode()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-2 rounded-xl transition-all">
                    🖥️ 切換至手機單欄模式
                </button>
                
                <div class="bg-slate-100 p-1 rounded-xl flex gap-1 text-xs font-bold">
                    <button id="fontSize-sm" onclick="changeFontSize('text-sm')" class="px-3 py-1 rounded-lg text-slate-500">A-</button>
                    <button id="fontSize-base" onclick="changeFontSize('text-base')" class="px-3 py-1 rounded-lg bg-white text-emerald-600 shadow-sm">A</button>
                    <button id="fontSize-lg" onclick="changeFontSize('text-lg')" class="px-3 py-1 rounded-lg text-slate-500">A+</button>
                </div>

                <div class="h-4 w-px bg-slate-200 mx-1"></div>
                <button onclick="handleLogout()" class="text-slate-400 hover:text-rose-600 text-sm font-medium transition-colors">登出</button>
            </div>
        </div>
        
        <div id="gridLayout" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100 h-fit space-y-6">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2"><span class="w-1.5 h-6 bg-emerald-500 rounded-full"></span> 錄入數據</h2>
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2">量測日期 (上下滾動選年、月、日)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="scroll-wheel-container">
                            <select id="scrollYear" class="scroll-wheel-select" size="4" onchange="updateDays()"></select>
                        </div>
                        <div class="scroll-wheel-container">
                            <select id="scrollMonth" class="scroll-wheel-select" size="4" onchange="updateDays()"></select>
                        </div>
                        <div class="scroll-wheel-container">
                            <select id="scrollDay" class="scroll-wheel-select" size="4"></select>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2">量測時間 (上下滾動選時、分)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="scroll-wheel-container">
                            <select id="scrollHour" class="scroll-wheel-select" size="4"></select>
                        </div>
                        <div class="scroll-wheel-container">
                            <select id="scrollMinute" class="scroll-wheel-select" size="4"></select>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl text-xs text-center font-bold">
                    <button id="modeFull" onclick="setMode(false)" class="bg-white text-emerald-600 py-2 rounded-lg shadow-sm">完整模式</button>
                    <button id="modeTempOnly" onclick="setMode(true)" class="text-slate-500 py-2 rounded-lg">僅記體溫</button>
                </div>

                <div id="bodyMetricsFields" class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="block text-xs font-medium text-slate-400">身高 (cm)</label>
                        <input type="number" id="height" step="0.1" placeholder="公分" class="w-full rounded-xl border-slate-200 border p-3 text-base font-bold outline-none bg-white">
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-medium text-slate-400">體重 (kg)</label>
                        <input type="number" id="weight" step="0.1" placeholder="公斤" class="w-full rounded-xl border-slate-200 border p-3 text-base font-bold outline-none bg-white">
                    </div>
                </div>

                <div id="bpFields" class="space-y-2">
                    <label class="block text-xs font-medium text-slate-400">血壓 (mmHg)</label>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="sys" placeholder="高壓" class="w-full rounded-xl border-slate-200 border p-3 text-base font-bold outline-none bg-white">
                        <input type="number" id="dia" placeholder="低壓" class="w-full rounded-xl border-slate-200 border p-3 text-base font-bold outline-none bg-white">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-medium text-slate-400">體溫 (°C)</label>
                    <input type="number" id="temp" step="0.1" placeholder="例如：36.5" class="w-full rounded-xl border-slate-200 border p-3 text-xl font-bold text-emerald-600 outline-none bg-white">
                </div>
                
                <button onclick="saveRecord()" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-xl hover:bg-emerald-700 shadow-md transition-all mt-4">儲存並同步到雲端</button>
            </div>

            <div id="dataDisplayArea" class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2"><span class="w-1.5 h-6 bg-rose-500 rounded-full"></span> 雲端趨勢分析圖</h2>
                        <button onclick="exportToGoogleSheets()" class="text-emerald-700 text-xs font-bold bg-emerald-50 px-3 py-2 rounded-lg hover:bg-emerald-100 transition-all">💚 匯出至 Google 試算表 (CSV)</button>
                    </div>
                    <div class="h-80 w-full"><canvas id="healthChart"></canvas></div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100">
                    <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><span class="w-1.5 h-6 bg-amber-500 rounded-full"></span> 雲端歷史日誌</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-slate-50 text-slate-500">
                                <tr>
                                    <th class="p-3 font-bold">時間</th>
                                    <th class="p-3 font-bold">身高 / 體重</th>
                                    <th class="p-3 font-bold">血壓 (高/低)</th>
                                    <th class="p-3 font-bold">體溫</th>
                                    <th class="p-3 font-bold text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="logTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                        <div id="noDataText" class="text-center py-10 text-slate-400 text-xs hidden">雲端尚無數據，請開始記錄</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 🔒 固定配置好妳的 Firebase 金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyCERuzuN4FE14Tb54xE-FQUdbcVRVZ9jts",
            authDomain: "health-log-6bdc7.firebaseapp.com",
            projectId: "health-log-6bdc7",
            storageBucket: "health-log-6bdc7.firebasestorage.app",
            messagingSenderId: "13112727574",
            appId: "1:13112727574:web:f1c32e3b1f4af5d526fd37",
            measurementId: "G-NVX7N1S4YY"
        };

        let db = null; let currentUser = null; let myLogs = []; let healthChart = null; let isTempOnly = false; let isRegisterMode = true;
        let forceMobileLayout = false;

        try { if (firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("換成") === -1) { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } } catch (e) { console.error(e); }
        function checkFirebase() { if (!db) { alert("❌ Firebase 尚未配置完全喔！"); return false; } return true; }
        
        // 🕒 初始化自訂滾軸選擇器數據
        const now = new Date();
        const currentYear = now.getFullYear();
        
        // 填充年
        const yearSelect = document.getElementById('scrollYear');
        for(let i = currentYear - 2; i <= currentYear + 2; i++) {
            yearSelect.options.add(new Option(i + "年", i));
        }
        yearSelect.value = currentYear;

        // 填充月
        const monthSelect = document.getElementById('scrollMonth');
        for(let i = 1; i <= 12; i++) {
